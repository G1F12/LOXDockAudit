<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">LOXDockAudit workflow overview</title>
  <desc id="desc">A seven-step computational workflow from input structures through reports and CSV outputs.</desc>
  <rect width="980" height="360" fill="#ffffff"/>
  <text x="490" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">LOXDockAudit computational workflow</text>
  <text x="490" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Productive geometry analysis with controls and independent AF-Multimer comparison</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="28" y="122" width="116" height="82" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="86" y="154" font-weight="700" fill="#1e3a8a">Input</text>
    <text x="86" y="176" fill="#1f2937">PDB + YAML</text>

    <line x1="150" y1="163" x2="192" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="198" y="122" width="116" height="82" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="256" y="154" font-weight="700" fill="#166534">Structural QC</text>
    <text x="256" y="176" fill="#1f2937">fold checks</text>

    <line x1="320" y1="163" x2="362" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="368" y="122" width="116" height="82" rx="8" fill="#f8fafc" stroke="#475569"/>
    <text x="426" y="150" font-weight="700" fill="#334155">Docking</text>
    <text x="426" y="171" fill="#1f2937">pose analysis</text>

    <line x1="490" y1="163" x2="532" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="538" y="122" width="116" height="82" rx="8" fill="#fff7ed" stroke="#f97316"/>
    <text x="596" y="146" font-weight="700" fill="#9a3412">Productive</text>
    <text x="596" y="166" font-weight="700" fill="#9a3412">geometry</text>
    <text x="596" y="187" fill="#1f2937">distance + angle</text>

    <line x1="660" y1="163" x2="702" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="708" y="122" width="116" height="82" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="766" y="150" font-weight="700" fill="#991b1b">Controls</text>
    <text x="766" y="171" fill="#1f2937">inactive + screen</text>

    <line x1="824" y1="163" x2="866" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="872" y="122" width="80" height="82" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="912" y="150" font-weight="700" fill="#5b21b6">AF</text>
    <text x="912" y="171" fill="#1f2937">compare</text>
  </g>

  <line x1="912" y1="210" x2="912" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="362" y="254" width="256" height="62" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="490" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#155e75">Reports + CSV outputs</text>
  <text x="490" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">reproducible tables, Markdown reports, visual summaries</text>
  <path d="M 912 248 C 912 286 660 285 626 285" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
