[project]
name = "loxdockaudit"
version = "0.2.1"
description = "Negative-control-aware docking and productive geometry auditor for LOX-collagen engineering."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "biopython",
    "numpy",
    "pandas",
    "pyyaml",
    "click",
    "pytest",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-PyYAML",
]

[project.scripts]
loxdockaudit = "loxdockaudit.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
